<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h1>My favorite Subjects</h1>

    <h2>Unordered List</h2>
    <uL>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </uL>
    <h2>Ordered list</h2>
    <ol>
        <li>Learn HTML</li>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
    </ol>
    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>Used to create webpage structure.</dd>

        <dt>CSS</dt>
        <dd>Used to style webpages</dd>
    </dl>
</body>
</html>
