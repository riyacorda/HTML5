<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header style="color: rgb(179, 104, 12);">
        <h1>Complete HTML Form Example</h1>
        <p>
            this page demonstrates different HTML form elements and input types.
        </p>
    </header>
    <hr>
    <form>
<fieldset>

<legend>Personal Information</legend>
<!--Text Input-->
<p>
    <label for="firstName">First name</label>
    <input type="text"
    id="riya"
    name="riya"
    placeholder="Enter your first name"
    required
    minlength="2"
    maxlength="50"
    autocomplete="given-name"
    >
</p>
<p>
    <label for="lastName">Last Name :</label>
    <input type="text"
    id="corda"
    name="corda"
    placeholder="Enter your last name"
    required
    minlength="2"
    maxlength="50"
    autocomplete="family-name"
    >
</p>
<p>
    <label for="username">Username:</label>
    <input type="text"
    id="Riya Corda"
    name="Riya Corda"
    placeholder="Enter username"
    required
    minlength="4"
    maxlength="20">
</p>
<p>
<label for="password">Password:</label>
<input type="password" 
id="password" 
name="password" 
placeholder="enter the password"
required
minlength="8"
maxlength="20"
autocomplete="new-password">
</p>
<P>
    <label for="confirmPassword">Confirm Password:</label>
    <input
    type="password"
    id="confirmPassword"
    name="confirmPassword"
    placeholder="confirm your Password"
    required>
</p>
<p>
    <label for="email">Email Address:</label>
    <input
    type="email"
    id="email"
    name="email"
    placeholder="riyacorda61@gmail.com"
    required
    autocomplete="email">
</p>
<p>
    <label for="phone">Phone:</label>
    <input
    type="tel"
    id="phone"
    name="phone"
    placeholder="Enter phone number"
    required
    autocomplete="tel">
</p>
<p>
    <label for="search">Search:</label>
    <input
    type="search"
    id="search"
    name="search"
    placeholder="search something">
</p>
<p>
    <label for="website">Personal website:</label>
    <input
    type="url"
    id="website"
    name="website"
    placeholder="https://google.com">
</p>
<p>
    <label for="age">Age:</label>
    <input
    type="number"
    id="age"
    name="age"
    min="1"
    max="100"
    step="2"
    placeholder="Enter your age">
</p>
</fieldset>
<fieldset>
    <legend>Gender</legend>
    <p>Select your gender:</p>
    <input
    type="radio"
    id="male"
    name="gender"
    value="male">
    <label for="male">Male</label>
    <br>
    <input
    type="radio"
    id="female"
    name="gender"
    value="female"
    >
    <label for="female">Female</label>
    <br>
    <input
    type="radio"
    id="other"
    name="gender"
    value="other"
    >
    <label for="other">Other</label>
    <br>
    <input
    type="radio"
    id="preferNot"
    name="gender"
    value="preferNot-to-say"
    >
    <label for="preferNot-to-say">preferNot-to-say</label>
</fieldset>
<br>
<fieldset>
    <legend>Date and Time Information</legend>
    <!--date-->
    <p>
        <label for="dob">Date of Birth:</label>
        <input
        type="date"
        id="dob"
        name="dob">
    </p>
    <p>
        <label for="appointmentDate">appointmentDate</label>
        <input
        type="date"
        id="appointmentDate"
        min="2026-01-01"
        max="2030-12-30">
    </p>
    <p>
        <label for="appointmentTime">appointmentTime</label>
        <input
        type="time"
        id="appointmentTime"
        name="appointmentTime">
    </p>
    <p>
        <label for="week">Select Week:</label>
        <input
        type="week"
        id="week"
        name="week">
    </p>
    <p>
        <label for="meeting">Meeting Date and Time:</label>
        <input
        type="datetime-local"
        id="meeting"
        name="meeting">
    </p>
</fieldset>
<br>
<fieldset>
    <legend>Address Information</legend>
<p>
    <label for="address">Full Address:</label>
    <br>
    <textarea
    id="address"
    name="address"
    rows="5"
    cols="50"
    placeholder="Enter your complete address"
    maxlength="300"></textarea>
</p>
<p>
    <label for="city">City:</label>
    <input
    type="text"
    id="city"
    name="city"
    placeholder="Enter city">
</p>
<p>
    <label for="state">State:</label>
    <input
    type="text"
    id="state"
    name="state"
    placeholder="Enter state">
</p>
<p>
    <label for="pincode">PIN Code:</label>
    <input
    type="text"
    id="pincode"
    name="pincode"
    placeholder="Enter PIN code"
    maxlength="6">
</p>
<p>
    <label for="country">Country:</label>
    <input
    list="countries"
    id="country"
    placeholder="Choose or type country">
    <datalist id="countries">
<option value="India">
<option value="United States">
<option value="United Kingdom">
<option value="canada">
<option value="Australia">
<option value="Germany">
<option value="France">
</datalist>
</fieldset>
<br>
<fieldset>
    <legend>Education Information</legend>
    <p>
        <label for="Education">Highest Qualification:</label>
        <select
        id="Education"
        name="Education">
    <option value="">

    </select>
</option>
<option value="10th"></option>
<option value="12th"></option>
<option value="Diploma"></option>
    </p>
</fieldset>
</form>
</body>
</html>
