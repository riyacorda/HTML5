<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> HTML Table Tags</title>
</head>
<body>
    <h1>HTML Table Example</h1>
    <table border="1">

        <!--Table Caption-->
        <caption>Student Details</caption>
        <!--Table Header-->
        <thead>
            <tr>
                <th rowspan="2">Roll No</th>
                <th rowspan="2">Name</th>
                <th colspan="3">Marks</th>
                <th rowspan="2">Total</th>
                <th rowspan="2">Grade</th>
            </tr>
            <tr>
                <th>English</th>
                <th>Maths</th>
                <th>Science</th>
            </tr>
        </thead>
        <!--Table Body-->
        <tbody>
            <tr>
                <td>101</td>
                <td>Rahul</td>
                <td>85</td>
                <td>90</td>
                <td>88</td>
                <td>263</td>
                <td>A</td>
            </tr>
            <tr>
                <td>102</td>
                <td>Ananya</td>
                <td>92</td>
                <td>95</td>
                <td>90</td>
                <td>277</td>
                <td>A+</td>
            </tr>
            <tr>
                <td>103</td>
                <td>Vikram</td>
                <td>78</td>
                <td>82</td>
                <td>80</td>
                <td>240</td>
                <td>B+</td>
            </tr>
            <tr>
                <td>104</td>
                <td>priya</td>
                <td>88</td>
                <td>91</td>
                <td>94</td>
                <td>273</td>
                <td>A+</td>
            </tr>
        </tbody>
        <!--Table Footer-->
        <tfoot>
            <tr>
                <th colspan="5">Class Average</th>
                <th>263.25</th>
                <th>A</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
