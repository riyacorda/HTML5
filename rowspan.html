<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Timetable</title>
</head>
<body>
    <h1>Class Timetable</h1>
    <table border="2">
    <caption><b>Class Timetable</b></caption>
        <tr>
        <th>Day</th>
        <th>9AM-10AM</th>
        <th>10AM-11AM</th>
        <th>11AM-12PM</th>
        </tr>
        <tr>
            <td rowspan="2">Monday</td>
            <td>HTML</td>
            <td>CSS</td>
            <td>JavaScript</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>SQL</td>
            <td>Data Science</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>Python</td>
            <td>HTML</td>
            <td>SQL</td>
        </tr>

    </table>
</body>
</html>
