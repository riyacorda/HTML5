<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>campus cafe</title>
    <style>
        body{
            background-color: #f5eee5;
            font-family: Arial, sans-serif;
            color: #34251f;
            margin: 0;
            padding: 30px;
        }
        .menu{
            background-color: white;
            max-width: 620px;
            margin: auto;
            padding: 30px;
            border: 2px solid #d8b99b;
            border-radius: 18px;
            box-shadow: 0 8px 20px #00000018;
        }
        h1{ text-allign:center; color: #7b452b; font-size: 36px;}
        .tagline{text-align: center; font-style: italic;}
        h2{color: #9a5c37;border-bottom: 2px solid #ead8c8;padding-bottom: 8px;}
        .item{ display: flex;justify-content: space-between;padding: 9px 0;}
        .special{background-color: #fff1c9;padding: 12px;border-radius:8px;}
        footer{text-align: center;margin-top: 25px;color: #765f53;font-size: 13px;}
    </style>
</head>
<body>
    <main class="menu">
        <h1>☕Campus cafe</h1>
        <p class="tagline">Good coffee.Great Ideas</p>
        <hr>
        <h2>Signature drinks</h2>
        <div class="item"><span>Classic cappuccino</span><strong>120</strong></div>
        <div class="item"><span>Cold Coffee</span><strong>140</strong></div>
        <div class="item"><span>Caramel Latte</span><strong>160</strong></div>
        <h2>Quick Bites</h2>
        <div class="item"><span>Grilled Sandwich</span><strong>100</strong></div>
        <div class="item"><span>Chocolate Brownie</span><strong>90</strong></div>
        <p class="special"><strong>Barista's Pick:</strong>Caramel Latte + Brownie- 22</p>
        <footer>Open daily . 9:00 AM - 8:00PM<br>Made with  ☕  and a little creativity</footer>
    </main>
</body>
</html>
